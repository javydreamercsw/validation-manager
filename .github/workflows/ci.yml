name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Both submodule repos are public; no key needed
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        # DemoBuilderTest and TestPlanServerTest are order-dependent: they
        # pass alone but fail in the full suite (shared H2 file DB + in-JVM
        # static state). Tracked separately.
        run: >
          mvn -B -V verify -Dtest='!DemoBuilderTest,!TestPlanServerTest'
          -Dsurefire.failIfNoSpecifiedTests=false
