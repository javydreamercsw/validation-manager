name: CI

on:
  push:
    branches: [master, 0.4.0]
  pull_request:
    branches: [master, 0.4.0]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SUBMODULE_DEPLOY_KEY }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test
        # DemoBuilderTest is order-dependent: passes alone, fails in the full
        # suite (shared H2 file DB + in-JVM static state). Tracked separately.
        run: >
          mvn -B -V verify -Dtest='!DemoBuilderTest'
          -Dsurefire.failIfNoSpecifiedTests=false
